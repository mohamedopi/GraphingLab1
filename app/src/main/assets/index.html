<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#173d9a"><title>Graphing Lab</title>
<style>
:root{--bg:#f5f8fc;--panel:#fff;--ink:#13233d;--muted:#65748b;--line:#d8e2ef;--blue:#245bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 18px;background:linear-gradient(110deg,#173d9a,#1269ba 48%,#14a9a6);color:#fff}h1{font-size:23px;margin:0 0 4px}header p{margin:0;opacity:.9;font-size:13px}
main{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(230px,320px) 1fr;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 5px 18px #17365d0c;min-width:0}
h2{font-size:16px;margin:0 0 10px}.tabs,.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}button,select,input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--ink)}button{cursor:pointer}.active,.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}input,select{width:100%;font-family:ui-monospace,monospace;font-size:13px}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:7px 0}.hidden{display:none}
.presets{display:flex;gap:6px;flex-wrap:wrap}.presets button{font-size:12px;padding:7px}.canvashead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.grad{display:inline-block;width:82px;height:8px;border-radius:8px;vertical-align:middle;background:linear-gradient(90deg,#3023a8,#1769ff,#00c9d5,#57d67b,#ffe52d)}
canvas{display:block;width:100%;height:52vh;min-height:290px;border:1px solid var(--line);border-radius:10px;background:#fbfdff;touch-action:none}.status{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
@media(max-width:740px){main{grid-template-columns:1fr;padding:9px}.canvasPanel{order:1}.controls{order:2}canvas{height:42vh;min-height:260px}header{padding:14px}}
</style></head><body>
<header><h1>Graphing Lab</h1><p>رسم رياضي ثنائي وثلاثي الأبعاد · أزرق ← سماوي ← أخضر ← أصفر</p></header>
<main><section class="panel controls"><h2>إعدادات المعادلة</h2>
<div class="tabs"><button id="tab2" class="active">رسم 2D</button><button id="tab3">سطح 3D</button></div>
<div id="fields2"><label for="eq2">الدالة y = f(x)</label><input id="eq2" value="sin(x)" spellcheck="false" autocapitalize="off">
<label for="xmin">أقل قيمة x</label><input id="xmin" type="number" value="-10" step="1"><label for="xmax">أكبر قيمة x</label><input id="xmax" type="number" value="10" step="1"></div>
<div id="fields3" class="hidden"><label for="coordMode">نظام الإحداثيات</label><select id="coordMode"><option value="cart">ديكارتي: z=f(x,y)</option><option value="cyl">أسطواني: z=f(r,theta)</option><option value="sph">كروي: r=f(theta,phi)</option></select>
<label for="eq3">معادلة السطح</label><input id="eq3" value="sin(sqrt(x^2+y^2))" spellcheck="false" autocapitalize="off"><div id="eqHint" class="hint">الزوايا بالراديان.</div>
<label for="range3">حد المجال L</label><input id="range3" type="number" value="3" min="0.5" max="10" step="0.5"><label for="resolution">دقة الرسم</label><select id="resolution"><option value="20">سريع</option><option value="30" selected>متوازن</option><option value="42">تفصيلي</option></select></div>
<div class="buttons"><button id="draw" class="primary">ارسم</button><button id="reset">إعادة ضبط المنظور</button></div><label>أمثلة سريعة</label><div class="presets" id="presets"></div>
<p class="hint">اسحب بإصبعك لتدوير السطح. استخدم ^ للأسس مثل x^2. الزوايا بالراديان. المعادلات الضمنية لا تُحل تلقائيًا في هذه النسخة.</p></section>
<section class="panel canvasPanel"><div class="canvashead"><h2 id="plotTitle">y = sin(x)</h2><span class="hint">الألوان: <span class="grad"></span></span></div><canvas id="plot" aria-label="الرسم الرياضي"></canvas><div class="status" id="status">جاهز</div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('plot'),ctx=canvas.getContext('2d');let mode=2,rotX=-.62,rotZ=.65,zoom=1,drag=null;
const p2=[['sin(x)','sin(x)'],['قطع مكافئ','x^2/4'],['موجة مخمدة','exp(-abs(x)/4)*sin(3*x)'],['cos(x)','cos(x)']];
const pCart=[['تموج','sin(sqrt(x^2+y^2))'],['قطع مكافئ','(x^2+y^2)/4'],['سرج','x^2-y^2'],['موجة','cos(x)*sin(y)']];
const pCyl=[['تموج','sin(r)'],['قطع مكافئ','r^2/4'],['مخروط','r']];const pSph=[['كرة','2'],['تشوه بسيط','2+0.4*sin(phi)*cos(theta)']];
function palette(t){t=Math.max(0,Math.min(1,t));const s=[[48,35,168],[23,105,255],[0,201,213],[87,214,123],[255,229,45]],q=t*4,i=Math.min(3,Math.floor(q)),a=q-i;return `rgb(${s[i].map((v,k)=>Math.round(v+(s[i+1][k]-v)*a)).join(',')})`}
function compile(expr,vars){let s=expr.toLowerCase().replace(/\s+/g,'').replace(/π/g,'pi').replace(/\^/g,'**');if(!/^[0-9a-z_+*/().,%*-]+$/.test(s))throw Error('صيغة غير مدعومة؛ استخدم الرموز الرياضية المعتادة.');const allowed=['sin','cos','tan','asin','acos','atan','sqrt','abs','exp','log','floor','ceil','min','max','pi','e',...vars];for(const id of(s.match(/[a-z_]+/g)||[]))if(!allowed.includes(id))throw Error('رمز غير معروف: '+id);s=s.replace(/\bpi\b/g,'Math.PI').replace(/\be\b/g,'Math.E');for(const f of ['sin','cos','tan','asin','acos','atan','sqrt','abs','exp','log','floor','ceil','min','max'])s=s.replace(new RegExp('\\b'+f+'\\s*\\(','g'),'Math.'+f+'(');return new Function(...vars,'"use strict";return ('+s+');')}
function size(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);return[r.width,r.height]}
function bg(w,h){ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,w,h)}
function buildPresets(){const c=$('coordMode').value,list=mode===2?p2:c==='sph'?pSph:c==='cyl'?pCyl:pCart;$('presets').innerHTML='';for(const[n,e]of list){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{(mode===2?$('eq2'):$('eq3')).value=e;draw()};$('presets').appendChild(b)}}
function draw2(){const[w,h]=size();bg(w,h);const xmin=Number($('xmin').value),xmax=Number($('xmax').value);if(!(xmax>xmin))throw Error('القيمة العظمى يجب أن تكون أكبر من الصغرى.');const fn=compile($('eq2').value,['x']),pad=35,n=Math.max(500,Math.floor(w*1.5)),vals=[];let lo=Infinity,hi=-Infinity;for(let i=0;i<=n;i++){const x=xmin+(xmax-xmin)*i/n;let y=fn(x);if(!Number.isFinite(y)||Math.abs(y)>1e5)y=NaN;else{lo=Math.min(lo,y);hi=Math.max(hi,y)}vals.push([x,y])}if(!Number.isFinite(lo))throw Error('لا توجد قيم حقيقية في المجال.');const span=hi-lo||1,ym=(hi+lo)/2,ys=(h-55)/(span*1.18),sx=(w-2*pad)/(xmax-xmin);ctx.strokeStyle='#e1e8f1';for(let i=0;i<=10;i++){let x=pad+i*(w-2*pad)/10;ctx.beginPath();ctx.moveTo(x,14);ctx.lineTo(x,h-24);ctx.stroke()}for(let i=0;i<=8;i++){let y=14+i*(h-38)/8;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}ctx.strokeStyle='#8391a5';ctx.beginPath();ctx.moveTo(pad,h/2);ctx.lineTo(w-pad,h/2);ctx.stroke();ctx.lineWidth=2.6;ctx.strokeStyle='#1769ff';ctx.beginPath();let open=false;for(const[x,y]of vals){if(!Number.isFinite(y)){open=false;continue}const X=pad+(x-xmin)*sx,Y=h/2-(y-ym)*ys;if(!open){ctx.moveTo(X,Y);open=true}else ctx.lineTo(X,Y)}ctx.stroke();$('status').textContent=`تم رسم y=f(x) · المجال [${xmin}, ${xmax}] · مدى y تقريبي [${lo.toPrecision(3)}, ${hi.toPrecision(3)}]`}
function project(x,y,z,w,h){const cz=Math.cos(rotZ),sz=Math.sin(rotZ),cx=Math.cos(rotX),sx=Math.sin(rotX),X=x*cz-y*sz,Y=x*sz+y*cz,Z=Y*cx+z*sx,V=z*cx-Y*sx,scale=Math.min(w,h)*.17*zoom;return[w/2+X*scale,h*.53-Z*scale,V]}
function draw3(){const[w,h]=size();bg(w,h);const L=Number($('range3').value),N=Number($('resolution').value),cm=$('coordMode').value;const fn=compile($('eq3').value,cm==='cart'?['x','y']:cm==='cyl'?['r','theta']:['theta','phi']),verts=[],zs=[];
for(let j=0;j<=N;j++){verts[j]=[];for(let i=0;i<=N;i++){let x,y,z;if(cm==='cart'){x=-L+2*L*i/N;y=-L+2*L*j/N;z=fn(x,y)}else if(cm==='cyl'){const r=L*i/N,theta=2*Math.PI*j/N;x=r*Math.cos(theta);y=r*Math.sin(theta);z=fn(r,theta)}else{const theta=2*Math.PI*i/N,phi=Math.PI*j/N,r=fn(theta,phi);x=r*Math.sin(phi)*Math.cos(theta);y=r*Math.sin(phi)*Math.sin(theta);z=r*Math.cos(phi)}if(![x,y,z].every(Number.isFinite)||Math.max(Math.abs(x),Math.abs(y),Math.abs(z))>1e5)z=NaN;verts[j][i]={x,y,z};if(Number.isFinite(z))zs.push(z)}}
if(!zs.length)throw Error('لا توجد قيم حقيقية للسطح في هذا المجال.');const lo=Math.min(...zs),hi=Math.max(...zs),span=hi-lo||1,scaleZ=2.7/span,polys=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=verts[j][i],b=verts[j][i+1],c=verts[j+1][i+1],d=verts[j+1][i];if([a,b,c,d].some(v=>!Number.isFinite(v.z)))continue;const pp=[a,b,c,d].map(v=>project(v.x/L,v.y/L,(v.z-(lo+hi)/2)*scaleZ,w,h));polys.push({pp,z:(a.z+b.z+c.z+d.z)/4})}polys.sort((a,b)=>a.pp.reduce((s,p)=>s+p[2],0)-b.pp.reduce((s,p)=>s+p[2],0));for(const p of polys){ctx.beginPath();ctx.moveTo(p.pp[0][0],p.pp[0][1]);for(const q of p.pp.slice(1))ctx.lineTo(q[0],q[1]);ctx.closePath();ctx.fillStyle=palette((p.z-lo)/span);ctx.fill();ctx.strokeStyle='rgba(10,38,70,.35)';ctx.lineWidth=.45;ctx.stroke()}$('status').textContent=`سطح 3D · شبكة ${N}×${N} · مدى z تقريبي [${lo.toPrecision(3)}, ${hi.toPrecision(3)}] · اسحب للتدوير`}
function draw(){try{$('plotTitle').textContent=mode===2?'y = '+$('eq2').value:$('eq3').value+' · '+$('coordMode').selectedOptions[0].text;mode===2?draw2():draw3()}catch(e){$('status').textContent='خطأ في المعادلة: '+e.message}}
$('tab2').onclick=()=>{mode=2;$('tab2').classList.add('active');$('tab3').classList.remove('active');$('fields2').classList.remove('hidden');$('fields3').classList.add('hidden');buildPresets();draw()};
$('tab3').onclick=()=>{mode=3;$('tab3').classList.add('active');$('tab2').classList.remove('active');$('fields2').classList.add('hidden');$('fields3').classList.remove('hidden');buildPresets();draw()};
$('coordMode').onchange=()=>{const c=$('coordMode').value;$('eq3').value=c==='sph'?'2':c==='cyl'?'sin(r)':'sin(sqrt(x^2+y^2))';$('eqHint').textContent=c==='sph'?'الكروي: r=f(theta,phi)، الزوايا بالراديان.':c==='cyl'?'الأسطواني: z=f(r,theta)، الزوايا بالراديان.':'الديكارتي: z=f(x,y).';buildPresets();draw()};
$('draw').onclick=draw;$('reset').onclick=()=>{rotX=-.62;rotZ=.65;zoom=1;draw()};$('resolution').onchange=draw;['eq2','eq3','xmin','xmax','range3'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')draw()}));
canvas.addEventListener('pointerdown',e=>{if(mode!==3)return;drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag||mode!==3)return;rotZ+=(e.clientX-drag.x)*.009;rotX=Math.max(-1.45,Math.min(1.45,rotX+(e.clientY-drag.y)*.009));drag={x:e.clientX,y:e.clientY};draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{if(mode!==3)return;e.preventDefault();zoom=Math.max(.45,Math.min(2.4,zoom*(e.deltaY<0?1.08:.92)));draw()},{passive:false});window.addEventListener('resize',draw);buildPresets();draw();
</script></body></html>
